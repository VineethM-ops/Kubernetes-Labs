apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vinutest
  name: vinutest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vinutest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: vinutest
    spec:
      containers:
      - image: httpd:alpine3.24
        name: httpd
        resources: {}
status: {}
